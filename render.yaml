services:
  - type: web
    name: employee-registry-api
    env: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: employee-registry-db
          property: connectionString
      - key: Jwt__Secret
        generateValue: true
      - key: PORT
        value: 8080
      - key: AllowedOrigins
        value: "*" # Will update this after Vercel deployment

databases:
  - name: employee-registry-db
    plan: free
